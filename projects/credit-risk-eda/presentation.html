<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentation placeholder — Credit Risk EDA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Inter", Arial, sans-serif; text-align: center; padding: 2rem;
      background: linear-gradient(135deg, #F7F5F0, #D7CEE2);
      color: #2F2F2F;
    }
    .box { max-width: 560px; }
    .kick { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; color: #96742D; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; color: #7A5C9E; margin: 0 0 1rem; }
    p { color: #787878; line-height: 1.6; }
    code { font-family: "JetBrains Mono", monospace; background: #FDFCFB; border: 1px solid #C1C1C1; padding: .1rem .4rem; border-radius: 6px; font-size: .85em; }
  </style>
</head>
<body>
  <div class="box">
    <p class="kick">Placeholder slide</p>
    <h1>Your Quarto deck goes here</h1>
    <p>
      Render your presentation with <code>quarto render deck.qmd --to revealjs</code>,
      then save the output HTML as <code>presentation.html</code> in this folder,
      replacing this file. The project page will embed it automatically.
    </p>
  </div>
</body>
</html>
